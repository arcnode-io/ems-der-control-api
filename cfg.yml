local:
  logLevel: INFO
  port: 8080
  host: 127.0.0.1
  e2e: false
  postgresHost: localhost
  mqttBrokerUrl: tcp://localhost:1883
  mqttUsername: arcnode_der_control_api
  siteId: local_site
  # mock-derms-dispatch-api's own local default port — not a real utility, see its own readme.
  utilityMirrorUrl: http://localhost:8081
  # Where the utility should push DERControl Notifications. Goes out in this service's own
  # Subscription, so it has to be reachable from the utility rather than from here.
  publicBaseUrl: http://localhost:8080
  # How long the event log keeps a row; a daily job purges older ones (Joe: 90 days).
  eventRetentionDays: 90

beta: &beta
  logLevel: INFO
  port: 8080
  host: 0.0.0.0
  e2e: true
  postgresHost: postgres
  mqttBrokerUrl: tcp://hivemq:1883
  mqttUsername: arcnode_der_control_api
  siteId: beta_site
  # Placeholder. mock-derms-dispatch-api is a stand-in for an external utility and lives outside
  # this product's trust boundary (ems/readme.md's own diagram puts it in the mock_derms domain), so
  # it is not deployed alongside us. A real beta target is a real utility's endpoint, TBD.
  utilityMirrorUrl: http://mock-derms-dispatch-api:8080
  publicBaseUrl: http://der-control-api:8080
  eventRetentionDays: 90

# The full device demo: this service inside the compose stack, receiving DERControls from
# mock-derms-dispatch-api and republishing them onto the bus. Merged from beta for the container
# hostnames rather than copied, so the two cannot drift. One override: siteId matches every other
# service's device-demo block and the HMI's, since every MQTT topic is keyed by it.
# snake_case per ADR-002 §16 — the identifier regex allows no hyphens.
device-demo:
  <<: *beta
  siteId: device_demo_site
