# Spring-native wiring only. cfg.yml is the source of truth for non-secrets (via Config.Loader,
# which also feeds server.port / server.address / logging.level.root directly). Secrets come from
# the environment. Never add config values here that belong in cfg.yml.
spring:
  application:
    name: ems-der-control-api
  threads:
    virtual:
      enabled: true
  # local/CI default — own postgres on postgresHost. beta/cloud overrides all three via
  # DER_CONTROL_URL (DataSourceUrl.Loader), a libpq URL platform-api provisions per deployment.
  datasource:
    url: jdbc:postgresql://${app.postgresHost}:5432/postgres
    username: postgres
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks the entities fit it and refuses to boot if not.
      ddl-auto: validate
    open-in-view: false
  flyway:
    # The schema is shared with device-api, so "has tables already" never means "has ours". A schema
    # without a history table is marked at 0 so every migration, V1 included, still runs on it;
    # V1 is idempotent for exactly this reason.
    baseline-on-migrate: true
    baseline-version: 0
    # The database is shared with device-api in the same schema, so the history table carries this
    # service's name rather than Flyway's default.
    table: der_control_schema_history

server:
  port: ${app.port}
  address: ${app.host}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui
