stages:
  - check
  - publish
  - mirror

# The arcnode runner is a Debian shell executor — no `image:` / `services:` (ignored).
# It provides git+ssh, docker, node, python, aws. Java 21 comes from openjdk-21-jdk, installed by
# tooling-playbooks/gitlab-runner-setup.yml. The Maven wrapper pulls Maven itself.
# Failsafe (*IT) needs Docker for the Postgres + HiveMQ testcontainers — the runner has it.

check:
  stage: check
  # Reason: the runner host exports ENV=ci for the embedded HIL rig. This service has no HIL
  # profile, so the job names the one it wants rather than inheriting a flag meant for hardware.
  variables:
    ENV: local
  before_script:
    - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
    - |
      test -x "$JAVA_HOME/bin/javac" || { echo "openjdk-21-jdk missing on runner — run tooling-playbooks gitlab-runner-setup"; exit 1; }
    - |
      cat > .ci-toolchains.xml <<EOF
      <toolchains><toolchain><type>jdk</type><provides><version>21</version></provides><configuration><jdkHome>$JAVA_HOME</jdkHome></configuration></toolchain></toolchains>
      EOF
    - |
      # pipx installs land in ~/.local/bin, not reliably on PATH for a non-interactive job.
      export PATH="$HOME/.local/bin:$PATH"
      command -v semgrep >/dev/null || pipx install semgrep
    - |
      # The cross-repo IT pulls a public ECR image anonymously. A stale login from any job on
      # this shared runner would be offered instead and rejected, so clear it first.
      docker logout public.ecr.aws >/dev/null 2>&1 || true
  script:
    - make checks MVNW="./mvnw -B --no-transfer-progress -t .ci-toolchains.xml"
    # one verify call — unit+integration coverage must land in the same jacoco.exec for the 70% gate
    - ./mvnw -B --no-transfer-progress -t .ci-toolchains.xml clean verify
    - |
      awk -F, 'NR>1 {m+=$4; c+=$5} END {printf "Total coverage: %.1f%%\n", 100*c/(c+m)}' target/site/jacoco/jacoco.csv
  coverage: '/Total coverage: (\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
    paths:
      - target/site/jacoco/

publish:
  stage: publish
  script:
    - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
    - docker build -t public.ecr.aws/y1d2j6a8/ems-der-control-api .
    - docker push public.ecr.aws/y1d2j6a8/ems-der-control-api
  # Reason: the runner is a shared shell executor, so a login left here becomes every other
  # job's problem once the 12-hour token expires — Docker then presents the dead token instead
  # of pulling anonymously. after_script runs even when the push fails.
  after_script:
    - docker logout public.ecr.aws

mirror:
  stage: mirror
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - git checkout -B main
    - git push --mirror git@github.com:arcnode-io/ems-der-control-api.git
  only:
    - main
